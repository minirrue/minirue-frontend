name: Local release check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Node 22
        run: node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
      - name: Install from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --runInBand --watch=false
      - name: Production build
        run: npm run build
