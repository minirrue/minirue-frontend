# ci.yml — quality gate for minirue-frontend.
#
# Runs on every push to every branch (matches story-sync.yml's trigger style — a commit
# landing directly on `main` is checked exactly the same as one going through a PR). Fails
# the job on any nonzero exit from typecheck, lint, or test.

name: CI

on:
  push:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # seal-guard.mjs (§31) diffs against @{upstream}/HEAD~1 — needs real commit history,
          # not the default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # One check, one verdict. `if: always()` so this runs whether the steps above
      # passed or failed — a silent red build is the thing that let this repo sit
      # broken since August without anyone noticing.
      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ CI passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Typecheck, lint and tests all green on \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ CI failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch \`${{ github.ref_name }}\` at \`${{ github.sha }}\` did not pass." >> "$GITHUB_STEP_SUMMARY"
            echo "Open the failing step above for the first error." >> "$GITHUB_STEP_SUMMARY"
          fi
